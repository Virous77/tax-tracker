packages:
  - packages/*
  - apps/*

# Supply-chain cooldown: never resolve a version published less than 10 days ago (value in minutes).
minimumReleaseAge: 14400

# Only these packages may run install scripts.
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# pnpm 12 uses allowBuilds; keep this identical to the allow-list above.
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Pin exact versions so upgrades are deliberate.
savePrefix: ""
