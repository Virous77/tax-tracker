services:
  app:
    build:
      context: .
      args:
        VERSION: ${TAX_TRACKER_VERSION:-}
        REVISION: ${TAX_TRACKER_REVISION:-}
        REPOSITORY_URL: ${TAX_TRACKER_REPOSITORY_URL:-}
    image: ${TAX_TRACKER_IMAGE:-tax-tracker:local}
    depends_on:
      data-init:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
    environment:
      DATA_DIR: /data
      SOURCE_URL: ${SOURCE_URL:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      SECRETS_PASSPHRASE: ${SECRETS_PASSPHRASE:-}
      BINANCE_API_BASE: ${BINANCE_API_BASE:-}
      BINANCE_DATA_BASE: ${BINANCE_DATA_BASE:-}
      COINDCX_API_BASE: ${COINDCX_API_BASE:-}
      ETHERSCAN_API_BASE: ${ETHERSCAN_API_BASE:-}
      BLOCKSCOUT_API_BASE: ${BLOCKSCOUT_API_BASE:-}
      ALCHEMY_API_BASE: ${ALCHEMY_API_BASE:-}
      NODEREAL_API_BASE: ${NODEREAL_API_BASE:-}
      COINGECKO_API_BASE: ${COINGECKO_API_BASE:-}
      POLYGON_API_BASE: ${POLYGON_API_BASE:-}
      FINNHUB_API_BASE: ${FINNHUB_API_BASE:-}
    restart: unless-stopped
  data-init:
    image: ${TAX_TRACKER_IMAGE:-tax-tracker:local}
    pull_policy: never
    user: "0:0"
    network_mode: none
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data
    entrypoint:
      - node
      - -e
      - |
        const fs = require("node:fs");
        fs.chownSync("/data", 1000, 1000);
        for (const name of ["tax-tracker.db", "tax-tracker.db-wal", "tax-tracker.db-shm", ".session-secret"]) {
          const path = "/data/" + name;
          if (fs.lstatSync(path, { throwIfNoEntry: false })?.isFile())
            fs.lchownSync(path, 1000, 1000);
        }
    healthcheck:
      disable: true
  ollama:
    image: ollama/ollama:0.12.10@sha256:e8c3d1f6ad16323bc40dc63eff0701d4fc32113f75a86b54b3e836eef8290de6
    profiles: [ai]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
volumes:
  ollama:
